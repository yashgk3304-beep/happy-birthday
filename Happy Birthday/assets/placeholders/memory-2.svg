<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" role="img" aria-labelledby="title desc">
  <title id="title">Memory placeholder two</title>
  <desc id="desc">An abstract cinematic gold and teal memory placeholder.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#130f19"/>
      <stop offset="0.45" stop-color="#5f2439"/>
      <stop offset="1" stop-color="#16706a"/>
    </linearGradient>
    <linearGradient id="ribbon" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#ff9a85" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffe0a3" stop-opacity="0.82"/>
